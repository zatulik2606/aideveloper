<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crew - Risk Assessment Section</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .risk-assessment {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <section class="risk-assessment">
        <div class="container">
            <h2>Система оценки рисков</h2>
            <div class="risk-levels">
                <div class="risk-level green">
                    <div class="risk-icon">🟢</div>
                    <h3>Низкий риск</h3>
                    <p>Минимальное влияние на инфраструктуру</p>
                </div>
                <div class="risk-level yellow">
                    <div class="risk-icon">🟡</div>
                    <h3>Умеренный риск</h3>
                    <p>Требует внимания и дополнительного анализа</p>
                </div>
                <div class="risk-level red">
                    <div class="risk-icon">🔴</div>
                    <h3>Высокий риск</h3>
                    <p>Серьезное влияние на клиенты и сервисы</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
