<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crew - Audience Section</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .audience {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <section class="audience">
        <div class="container">
            <h2>Для кого эта платформа</h2>
            <div class="audience-grid">
                <div class="audience-card">
                    <i class="fas fa-users"></i>
                    <h3>IT-менеджеры</h3>
                    <p>Для контроля операционной деятельности</p>
                </div>
                <div class="audience-card">
                    <i class="fas fa-cogs"></i>
                    <h3>Инженеры эксплуатации</h3>
                    <p>Для оценки качества проводимых работ</p>
                </div>
                <div class="audience-card">
                    <i class="fas fa-building"></i>
                    <h3>Руководители инфраструктуры</h3>
                    <p>Для принятия информированных решений</p>
                </div>
                <div class="audience-card">
                    <i class="fas fa-clipboard-check"></i>
                    <h3>Комплаенс-офицеры</h3>
                    <p>Для соблюдения стандартов и регуляторных требований</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
